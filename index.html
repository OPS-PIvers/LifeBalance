<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LifeBalance</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/lifebalance_icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeBalance" />

    <!-- Fonts are self-hosted from /public/fonts and declared via @font-face in index.css -->
    <!-- Warm up Firebase connections (auth + Firestore) ahead of the first SDK request -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

    <!-- Apply saved theme before paint to avoid a flash of the wrong color scheme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('LIFEBALANCE_THEME');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((stored === 'system' || !stored) && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          // Always set color-scheme to the resolved theme so UA-native controls
          // (scrollbars, form widgets) match even when the choice opposes the OS.
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-brand-50 dark:bg-brand-900 text-brand-800 dark:text-brand-100 antialiased selection:bg-brand-200 dark:selection:bg-brand-700 overscroll-none">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Register service worker for PWA updates
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('[App] SW registered:', registration.scope);

            // Check for updates on page load
            registration.update();

            // Check for updates periodically (every 5 minutes)
            setInterval(() => {
              registration.update();
            }, 5 * 60 * 1000);

            // Handle updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('[App] New SW installing...');

              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New content available, show refresh prompt
                  console.log('[App] New version available!');
                  if (confirm('A new version is available! Reload to update?')) {
                    newWorker.postMessage('skipWaiting');
                    window.location.reload();
                  }
                }
              });
            });
          }).catch((error) => {
            console.error('[App] SW registration failed:', error);
          });

          // Reload when new SW takes control
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('[App] New SW took control, reloading...');
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
