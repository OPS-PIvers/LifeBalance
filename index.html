<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: where supported (Chrome/Android), the
         layout viewport shrinks with the software keyboard so the header/toasts
         stay anchored; iOS ignores it (useKeyboardViewportAnchor covers it there).
         NO maximum-scale here: iOS ignores it for pinch-zoom but Android Chrome
         honors it and would block zoom entirely (WCAG 1.4.4). iOS's focus
         auto-zoom is instead prevented at the source — a global 16px font floor
         for form fields on coarse pointers in index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>LifeBalance</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/lifebalance_icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeBalance" />

    <!-- Theme color for browser/OS chrome. The TopToolbar is ALWAYS dark
         (bg-brand-800 light / bg-brand-900 dark), so both values match the
         toolbar — not the page background — to keep the status-bar strip
         continuous with the header. In sync with the html background in
         index.css. -->
    <meta name="theme-color" content="#242220" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)" />

    <!-- Fonts are self-hosted from /public/fonts and declared via @font-face in
         index.css with font-display: swap. Without a preload, the .woff2 URLs
         are only discovered once index.css has been parsed, so first-paint
         text renders in the fallback face and then swaps — on every load,
         including warm ones (this is a discovery-order problem, not a
         bandwidth one; firebase.json already serves these immutable). The
         always-mounted TopToolbar uses all three families in its top row, so
         all three are first-paint faces and are preloaded below. Only the
         `latin` subsets are preloaded — `latin-ext` stays lazily discovered
         under its own unicode-range, since the app's everyday strings are
         latin-only. `crossorigin` is required even though these are
         same-origin: fonts are always fetched in CORS mode, and without the
         attribute the browser treats the preload and the @font-face fetch as
         different requests and double-fetches instead of reusing the
         preload. These files live in /public, which Vite copies verbatim
         without content-hashing, so the URLs are stable across builds and
         safe to hardcode. -->
    <link rel="preload" href="/fonts/besley-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/spline-sans-mono-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Warm up Firebase connections (auth + Firestore) ahead of the first SDK request -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

    <!-- Settle every pre-paint-visible <html> attribute before first paint, so
         nothing about the page's appearance changes after the user already
         sees it (theme color scheme, base font-scale, and contrast retinting
         all change layout/paint via CSS keyed off these attributes/class).
         Without this, ThemeContext applies them in a useEffect — i.e. after
         React mounts, after first paint — so a user on 115%/130% font scale
         or high contrast would see the page painted at defaults and then
         resize/retint a moment later.
         These three localStorage keys and their validation/default rules are
         DUPLICATED from contexts/ThemeContext.tsx (readStoredPreference,
         readStoredFontScale, readStoredHighContrast) — keep them in sync: an
         unrecognised or absent value must fall back to the same default the
         context uses, so the pre-paint value and the post-mount value can
         never disagree. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('LIFEBALANCE_THEME');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((stored === 'system' || !stored) && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          // Always set color-scheme to the resolved theme so UA-native controls
          // (scrollbars, form widgets) match even when the choice opposes the OS.
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';

          // Mirrors ThemeContext's readStoredFontScale: only '100'/'115'/'130'
          // are valid, anything else (including absent) falls back to '100'.
          var storedFontScale = localStorage.getItem('LIFEBALANCE_FONT_SCALE');
          var fontScale = (storedFontScale === '100' || storedFontScale === '115' || storedFontScale === '130')
            ? storedFontScale
            : '100';
          document.documentElement.setAttribute('data-font-scale', fontScale);

          // Mirrors ThemeContext's readStoredHighContrast: only the literal
          // string 'true' means high contrast; anything else (including
          // absent) falls back to normal contrast.
          var storedHighContrast = localStorage.getItem('LIFEBALANCE_HIGH_CONTRAST');
          document.documentElement.setAttribute('data-contrast', storedHighContrast === 'true' ? 'high' : 'normal');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-brand-50 dark:bg-brand-900 text-brand-800 dark:text-brand-100 antialiased selection:bg-brand-200 dark:selection:bg-brand-700 overscroll-none">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Register service worker for PWA updates
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('[App] SW registered:', registration.scope);

            // Check for updates on page load
            registration.update();

            // Check for updates periodically (every 5 minutes)
            setInterval(() => {
              registration.update();
            }, 5 * 60 * 1000);

            // Handle updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('[App] New SW installing...');

              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New content available, show refresh prompt
                  console.log('[App] New version available!');
                  if (confirm('A new version is available! Reload to update?')) {
                    newWorker.postMessage('skipWaiting');
                    window.location.reload();
                  }
                }
              });
            });
          }).catch((error) => {
            console.error('[App] SW registration failed:', error);
          });

          // Reload when new SW takes control
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('[App] New SW took control, reloading...');
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
