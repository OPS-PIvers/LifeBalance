name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
    # Skip docs-only PRs; reviewing Markdown burns subscription usage for no
    # benefit. A PR touching any non-doc file still gets reviewed
    # (paths-ignore only skips when *every* changed file matches).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Cancel a superseded run when a newer commit lands on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    name: Claude Code Review
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Pro/Max subscription auth — generate locally with `claude setup-token`
          # and store as a repo secret. No metered API key required.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request (a React + TypeScript + Firebase PWA;
            pnpm workspace with a `functions/` Cloud Functions package).
            Read CLAUDE.md at the repo root for project conventions first.
            Focus on:
            - Correctness bugs and logic errors (money math in decimal
              dollars via utils/money.ts helpers, local-date handling via
              getLocalDateString, atomic writeBatch invariants)
            - Security issues (auth, Firestore rules, secret handling, XSS)
            - Performance regressions (context slice discipline, boot-bundle
              additions from static imports of Drawer-based modals)
            - Adherence to existing patterns and conventions (no lint/type
              suppressions, `@/` path aliases, design tokens over raw hex)

            Be concise and high-signal: only flag things that genuinely matter.
            If the PR looks good, say so briefly rather than inventing nitpicks.

            The PR branch is already checked out in the working directory.
            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific line-level issues.
            Only post GitHub comments — do not return review text as a message.

          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
