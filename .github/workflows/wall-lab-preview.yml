name: Wall lab preview (Phase 0)

# Builds the app with the throwaway #/wall-lab route (VITE_WALL_LAB=true) and
# deploys it to a 14-day Firebase Hosting PREVIEW CHANNEL, never to the live
# site. See docs/plans/wall-display-kiosk.md §6. Callables (geminiproxy) run
# in production, since preview channels share the project; the geminiproxy
# audio-size guard ships with the normal deploy when this PR merges.
#
# One-time human step after the first run: add the printed
# lifebalance-26080--wall-lab-*.web.app domain to Firebase Auth → Settings →
# Authorized domains, or Google sign-in fails on the preview URL.
#
# Delete this workflow with the lab route (Phase 6).

on:
  workflow_dispatch:

concurrency:
  group: wall-lab-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application (lab route on)
        run: pnpm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_USE_GEMINI_PROXY: "true"
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}
          VITE_WALL_LAB: "true"

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          create_credentials_file: true

      - name: Deploy to the wall-lab preview channel
        run: |
          pnpm exec firebase hosting:channel:deploy wall-lab --expires 14d --project lifebalance-26080 --json > channel.json
          URL=$(node -e "const r=require('./channel.json').result; const site=Object.values(r)[0]; console.log(site.url)")
          echo "Lab URL: ${URL}/#/wall-lab"
          echo "### Wall lab: ${URL}/#/wall-lab" >> "$GITHUB_STEP_SUMMARY"
          echo "Add \`${URL#https://}\` to Firebase Auth authorized domains if sign-in fails." >> "$GITHUB_STEP_SUMMARY"
