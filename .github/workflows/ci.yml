name: CI

# PR-only. A `push: branches-ignore: [main]` trigger used to sit alongside this
# one, but a PR branch is by definition not `main`, so every commit to an open
# PR satisfied BOTH and GitHub fired two identical, independent runs of every
# job below (verified 2026-07-28: runs 30401951577 and 30401948845, same commit,
# started 3s apart). Pushes to main are covered by deploy.yml; a branch with no
# PR open needs no CI, and opening the PR runs it.
on:
  pull_request:
    branches: [ main ]

# Supersede in-flight runs when new commits land on the same PR — the older run
# is validating code nobody will merge. Keyed on the PR ref so concurrent PRs
# never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      # firebase-tools >=15 requires a JDK >=21 to run the Firestore emulator
      # used by the "Firestore Rules Tests" step below. The runner's default JDK
      # is older, so pin 21 explicitly.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      # Cache the Firestore emulator jar (downloaded on first `pnpm test:rules`)
      # so subsequent runs don't re-fetch ~60 MB.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-firestore
      - name: Lint Root
        # We keep linting separate to clearly see which part fails (root or functions)
        run: pnpm lint
      - name: Lint Functions
        run: pnpm --filter functions run lint
      - name: Run Tests + Coverage Gate
        # Runs 'vitest run --coverage'. This both executes the full suite and
        # enforces the coverage thresholds for utils/** configured in
        # vite.config.ts (test.coverage.thresholds). A drop below the floor
        # fails CI, so coverage of the critical business logic can only ratchet
        # up. Replaces the previous plain 'pnpm test' step (coverage runs the
        # tests too, so we don't run the suite twice).
        # NOTE: this also covers functions/. The root `node` test project's
        # include is repo-wide (`**/*.test.{ts,tsx}` in vite.config.ts), and the
        # `functions/**` entry in coverage.exclude only drops them from the
        # coverage REPORT, not from execution. A separate "Functions Tests" step
        # (`cd .. && vitest run functions/src` — the same config, path-filtered)
        # used to run here and re-executed them verbatim.
        run: pnpm test:coverage
      # Firestore Security Rules tests run against the Firestore emulator
      # (ubuntu-latest ships a compatible JDK, so no extra Java setup needed).
      # This gates every firestore.rules change: a bad rules deploy is atomic
      # with no staging and can make all household data unreadable (see
      # plans/PRD.md §2), so the rules must be proven before they reach main.
      - name: Firestore Rules Tests
        run: pnpm test:rules
      - name: Build Root (Dry Run)
        run: pnpm run build
        env:
          # Dummy values to satisfy strict build checks
          VITE_FIREBASE_API_KEY: "mock-api-key"
          VITE_FIREBASE_AUTH_DOMAIN: "mock-auth-domain"
          VITE_FIREBASE_PROJECT_ID: "mock-project-id"
          VITE_FIREBASE_STORAGE_BUCKET: "mock-storage-bucket"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "mock-sender-id"
          VITE_FIREBASE_APP_ID: "mock-app-id"
          VITE_FIREBASE_MEASUREMENT_ID: "mock-measurement-id"
          VITE_GEMINI_API_KEY: "mock-gemini-key"
          VITE_FIREBASE_VAPID_KEY: "mock-vapid-key"
      - name: Build Functions
        run: pnpm --filter functions run build

  # Non-required, informational Playwright end-to-end job. It drives the app's
  # built-in Test Mode (mock data, no Firebase) against the Vite dev server.
  # This job is intentionally NOT part of branch protection — it must not block
  # merges to main. The `validate` job above remains the only required gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Cache the Chromium binary, keyed on the resolved @playwright/test
      # version so a Playwright bump invalidates it automatically. The download
      # is normally 21-30s but is network-dependent and has spiked to 451s
      # (run 30393407069) — this caps that tail as much as it trims the median.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Linux runner → --with-deps installs the OS libraries Chromium needs.
      # On a cache hit the browser binary is already present, but the apt
      # packages are not (they live outside the cached path), so still run
      # install-deps — it is the cheap half of the step.
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Run Playwright e2e
        # playwright.config.ts auto-starts `pnpm dev` (with VITE_ENABLE_TEST_MODE
        # set) via its webServer config. The dummy VITE_FIREBASE_* values mirror
        # the "Build Root (Dry Run)" step so the dev server boots without a real
        # .env.local. VITE_ENABLE_TEST_MODE here also covers the dev server's env.
        run: pnpm test:e2e
        env:
          VITE_ENABLE_TEST_MODE: 'true'
          VITE_FIREBASE_API_KEY: "mock-api-key"
          VITE_FIREBASE_AUTH_DOMAIN: "mock-auth-domain"
          VITE_FIREBASE_PROJECT_ID: "mock-project-id"
          VITE_FIREBASE_STORAGE_BUCKET: "mock-storage-bucket"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "mock-sender-id"
          VITE_FIREBASE_APP_ID: "mock-app-id"
          VITE_FIREBASE_MEASUREMENT_ID: "mock-measurement-id"
          VITE_GEMINI_API_KEY: "mock-gemini-key"
          VITE_FIREBASE_VAPID_KEY: "mock-vapid-key"
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
