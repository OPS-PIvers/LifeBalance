name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches-ignore: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      # firebase-tools >=15 requires a JDK >=21 to run the Firestore emulator
      # used by the "Firestore Rules Tests" step below. The runner's default JDK
      # is older, so pin 21 explicitly.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      # Cache the Firestore emulator jar (downloaded on first `pnpm test:rules`)
      # so subsequent runs don't re-fetch ~60 MB.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-firestore
      - name: Lint Root
        # We keep linting separate to clearly see which part fails (root or functions)
        run: pnpm lint
      - name: Lint Functions
        run: pnpm --filter functions run lint
      - name: Run Tests + Coverage Gate
        # Runs 'vitest run --coverage'. This both executes the full suite and
        # enforces the coverage thresholds for utils/** configured in
        # vite.config.ts (test.coverage.thresholds). A drop below the floor
        # fails CI, so coverage of the critical business logic can only ratchet
        # up. Replaces the previous plain 'pnpm test' step (coverage runs the
        # tests too, so we don't run the suite twice).
        run: pnpm test:coverage
      - name: Functions Tests
        run: pnpm --filter functions run test
      # Firestore Security Rules tests run against the Firestore emulator
      # (ubuntu-latest ships a compatible JDK, so no extra Java setup needed).
      # This gates every firestore.rules change: a bad rules deploy is atomic
      # with no staging and can make all household data unreadable (see
      # plans/PRD.md §2), so the rules must be proven before they reach main.
      - name: Firestore Rules Tests
        run: pnpm test:rules
      - name: Build Root (Dry Run)
        run: pnpm run build
        env:
          # Dummy values to satisfy strict build checks
          VITE_FIREBASE_API_KEY: "mock-api-key"
          VITE_FIREBASE_AUTH_DOMAIN: "mock-auth-domain"
          VITE_FIREBASE_PROJECT_ID: "mock-project-id"
          VITE_FIREBASE_STORAGE_BUCKET: "mock-storage-bucket"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "mock-sender-id"
          VITE_FIREBASE_APP_ID: "mock-app-id"
          VITE_FIREBASE_MEASUREMENT_ID: "mock-measurement-id"
          VITE_GEMINI_API_KEY: "mock-gemini-key"
          VITE_FIREBASE_VAPID_KEY: "mock-vapid-key"
      - name: Build Functions
        run: pnpm --filter functions run build

  # Non-required, informational Playwright end-to-end job. It drives the app's
  # built-in Test Mode (mock data, no Firebase) against the Vite dev server.
  # This job is intentionally NOT part of branch protection — it must not block
  # merges to main. The `validate` job above remains the only required gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Linux runner → --with-deps installs the OS libraries Chromium needs.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright e2e
        # playwright.config.ts auto-starts `pnpm dev` (with VITE_ENABLE_TEST_MODE
        # set) via its webServer config. The dummy VITE_FIREBASE_* values mirror
        # the "Build Root (Dry Run)" step so the dev server boots without a real
        # .env.local. VITE_ENABLE_TEST_MODE here also covers the dev server's env.
        run: pnpm test:e2e
        env:
          VITE_ENABLE_TEST_MODE: 'true'
          VITE_FIREBASE_API_KEY: "mock-api-key"
          VITE_FIREBASE_AUTH_DOMAIN: "mock-auth-domain"
          VITE_FIREBASE_PROJECT_ID: "mock-project-id"
          VITE_FIREBASE_STORAGE_BUCKET: "mock-storage-bucket"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "mock-sender-id"
          VITE_FIREBASE_APP_ID: "mock-app-id"
          VITE_FIREBASE_MEASUREMENT_ID: "mock-measurement-id"
          VITE_GEMINI_API_KEY: "mock-gemini-key"
          VITE_FIREBASE_VAPID_KEY: "mock-vapid-key"
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
