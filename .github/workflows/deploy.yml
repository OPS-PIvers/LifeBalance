name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Root
        # We keep linting separate to clearly see which part fails (root or functions)
        run: pnpm lint

      - name: Lint Functions
        run: pnpm --filter functions run lint

      - name: Run unit tests
        # Runs 'vitest run' via package.json script
        run: pnpm test

      - name: Generate build version
        run: |
          BUILD_VERSION=$(date +%s)
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          # Update service worker version - escape regex special chars and inject value properly
          sed -i "s|new Date()\.toISOString()|'$BUILD_VERSION'|g" public/sw.js
          echo "Build version injected: $BUILD_VERSION"
          # Verify the replacement worked
          grep "CACHE_VERSION = '$BUILD_VERSION'" public/sw.js || echo "WARNING: Version injection may have failed"

      - name: Build application
        run: pnpm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}
          # Plan 014: route Gemini calls through the geminiproxy Cloud Function so
          # the API key stays server-side. Stage 2 removes VITE_GEMINI_API_KEY above.
          VITE_USE_GEMINI_PROXY: "true"

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          create_credentials_file: true

      - name: Deploy to Firebase
        run: pnpm exec firebase deploy --project lifebalance-26080
