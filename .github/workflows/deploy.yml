name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  # Manual redeploy of whatever main currently is (e.g. after a deploy race
  # or a failed run) without needing an empty commit.
  workflow_dispatch:

# Serialize deploys: without this, back-to-back merges run their deploys in
# parallel and whichever finishes LAST wins — an older build can overwrite a
# newer one (happened 2026-07-18: #1030's deploy finished after #1031's and
# reverted prod to a pre-#1031 build). Queued runs are superseded so only the
# newest pending commit deploys after the in-flight run completes.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Root
        # We keep linting separate to clearly see which part fails (root or functions)
        run: pnpm lint

      - name: Lint Functions
        run: pnpm --filter functions run lint

      - name: Run unit tests
        # Runs 'vitest run' via package.json script. This covers functions/ too:
        # the root `node` test project's include is repo-wide, so a separate
        # "Functions Tests" step (which used to sit here) only re-ran the same
        # files through the same config. See the matching note in ci.yml.
        #
        # This lint+test block duplicates what CI already proved on the PR. It
        # stays because branch protection on `main` is currently DISABLED
        # (verified 2026-07-28), so a direct push to main would otherwise reach
        # production ungated. Revisit only once required checks are durably back.
        run: pnpm test

      - name: Generate build version
        run: |
          BUILD_VERSION=$(date +%s)
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          # Update service worker version - escape regex special chars and inject value properly
          sed -i "s|new Date()\.toISOString()|'$BUILD_VERSION'|g" public/sw.js
          echo "Build version injected: $BUILD_VERSION"
          # Verify the replacement worked
          grep "CACHE_VERSION = '$BUILD_VERSION'" public/sw.js || echo "WARNING: Version injection may have failed"

      - name: Build application
        run: pnpm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # Gemini calls route through the geminiproxy Cloud Function (Plan 014),
          # which holds the API key as a server-side secret. The client key is
          # intentionally NOT passed into the build, so it is absent from the
          # shipped bundle (roadmap B1 — the real security fix). To revert to the
          # direct client path, restore the VITE_GEMINI_API_KEY line below and
          # remove VITE_USE_GEMINI_PROXY.
          VITE_USE_GEMINI_PROXY: "true"
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}
          # Plan 11 — client error tracking (services/errorTracking.ts, wired at
          # index.tsx boot). No-op until the VITE_SENTRY_DSN GitHub secret exists:
          # a missing secret evaluates to an empty string, which initErrorTracking()
          # treats as "disabled" (it only activates on PROD + a non-empty DSN).
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          create_credentials_file: true

      - name: Deploy Firestore Rules
        run: pnpm exec firebase deploy --only firestore:rules --project lifebalance-26080

      # Indexes were historically NOT deployed by CI — the sendtodoreminders
      # index sat in firestore.indexes.json for weeks while the deployed query
      # failed FAILED_PRECONDITION every 15 minutes. Keep this step so the file
      # is always the live source of truth (deploys are diff-based: additions
      # build in the background, removals require the file entry to be deleted).
      - name: Deploy Firestore Indexes
        run: pnpm exec firebase deploy --only firestore:indexes --project lifebalance-26080

      - name: Deploy Cloud Functions
        run: pnpm exec firebase deploy --only functions --project lifebalance-26080

      - name: Deploy to Firebase Hosting
        run: pnpm exec firebase deploy --only hosting --project lifebalance-26080
